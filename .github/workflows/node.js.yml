# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npx playwright install chromium
    - name: Validate Car Clinic base URL
      env:
        CARCLINIC_BASE_URL: ${{ vars.CARCLINIC_BASE_URL }}
      run: |
        if [ -z "$CARCLINIC_BASE_URL" ]; then
          echo "Repository variable CARCLINIC_BASE_URL is not set."
          exit 1
        fi
        curl --fail --silent --show-error "$CARCLINIC_BASE_URL" > /dev/null
    - run: npm run build --if-present
    - run: npm test
      env:
        CARCLINIC_BASE_URL: ${{ vars.CARCLINIC_BASE_URL }}
